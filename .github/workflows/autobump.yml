name: Check for app updates

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday, 06:17 UTC
  workflow_dispatch:        # plus a "Run workflow" button in the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  exifcleaner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump ExifCleaner if a new release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/bump-exifcleaner.sh
